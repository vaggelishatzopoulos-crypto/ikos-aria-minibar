.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;font-size:22px;border:1px solid var(--line);background:#FAFBFD;border-radius:12px;color:var(--ink);font-family:var(--mono)}
.pad button:active{background:#EEF2F7} .pad .act{font-size:14px;font-family:var(--sans);color:var(--muted)}
.lerr{color:var(--red);font-size:13px;min-height:18px;margin-top:10px} .hint{margin-top:16px;font-size:12px;color:var(--faint)}
main{padding:16px 0 60px} .row{display:flex;align-items:center;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
h2.sec{font-size:18px;margin:2px 0 12px;color:var(--ink);font-weight:600}
.back{background:none;border:none;color:var(--teal);font-size:14px;font-weight:500;padding:6px 0;display:inline-flex;align-items:center;gap:6px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.seccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 16px 14px;text-align:left;transition:.12s}
.seccard:hover{border-color:var(--line-2);transform:translateY(-1px)}
.seccard .t{font-size:16px;font-weight:600;color:var(--ink)} .seccard .d{font-size:12px;color:var(--muted);margin:1px 0 12px}

.tabs{display:flex;gap:8px;margin:14px 0 14px;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--muted)}

.rno .px{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--faint);margin-left:7px}

function setFb(state,msg){ FB_ERR=msg||""; const el=document.getElementById("fbstat"); if(!el)return;
  el.className="fbstat "+(state==="live"?"live":state==="error"?"err":"local");
  el.textContent = state==="live"?"● Live": state==="connecting"?("● "+t("conn")): state==="error"?"● Error": ("● "+t("localTag"));
  el.onclick=()=>{ toast(state==="live"?t("connSync"):(FB_ERR||t("localOnly"))); };
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load "+src)); document.head.appendChild(s); }); }
function connectFirebase(){
  if(!CFG.firebase || !CFG.firebase.apiKey){ setFb("local",t("noConfig")); return; }
  setFb("connecting"); var done=false;
  setTimeout(function(){ if(!done && !FB) setFb("local",t("timeout")); }, 8000);
  Promise.all([
    loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"),
    loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"),
    loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js")
  ]).then(function(){ firebase.initializeApp(CFG.firebase); return firebase.auth().signInAnonymously(); })
  .then(function(){ FB=firebase.database(); return FB.ref("state").once("value"); })
  .then(function(snap){ done=true; var v=snap.val();
    if(v && v.rooms && Object.keys(v.rooms).length){ S=normalizeState(v); } else { FB.ref("state").set(S); }
    FB.ref("state").on("value", function(s){ var nv=s.val(); if(nv && nv.rooms && Object.keys(nv.rooms).length){ S=normalizeState(nv); render(); } });
    render(); setFb("live");
  }).catch(function(e){ done=true; FB=null; var code=(e&&e.code)?e.code:((e&&e.message)?e.message:String(e)); setFb("error",code); console.warn("Firebase off:",e); });
}

function gibParse(text, today){ const lines=text.split(/\r?\n/).filter(x=>x.length); const head=lines[0].split("\t"); const idx={}; head.forEach((h,i)=>idx[h.trim()]=i);
  if(idx["ROOM"]==null){ throw new Error(t("wrongReport")); }
  const get=(c,col)=>{ const i=idx[col]; return i==null?"":(c[i]||"").trim(); }; const rooms={};
  for(let li=1; li<lines.length; li++){ const c=lines[li].split("\t"); const rm=get(c,"ROOM"); if(!/^[1-8]\d{3}$/.test(rm)||rooms[rm])continue;
    const b=rm[0], deluxe="678".includes(b); const chips=[],flags={};
    get(c,"PREFERENCES").split(",").forEach(code=>{ code=code.trim(); if(!code||["1","2","3"].includes(code))return; if(PREF[code]){chips.push({t:PREF[code][0],c:PREF[code][1]});flags[code]=true;} else if(code==="ATT"){flags.ATT=true;} else chips.push({t:code,c:"other"}); });
    rooms[rm]={room:rm,section:sectionOf(rm),building:b,area:"",deluxeRoom:deluxe,type:get(c,"ARRIVAL")===today?"arrival":"inhouse",
      pax:{adults:+get(c,"ADULTS")||0,children:+get(c,"CHILDREN")||0},arrival:get(c,"ARRIVAL"),departure:get(c,"DEPARTURE"),arrivalTime:null,
      category:get(c,"ROOM_CATEGORY_LABEL"),vip:get(c,"VIP"),company:get(c,"COMPANY_NAME"),name:get(c,"SHARE_NAMES")||get(c,"FULL_NAME"),
      specialReq:get(c,"SPECIAL_REQUESTS"),resComment:get(c,"RES_COMMENT"),chips,flags,minibarReq:"",roomServiceReq:"",amenity:"",allergyText:"",attentionNote:"",dlxBenefits:false,wheelchair:false,contagious:false,farewell:false,
      status:{state:"pending",by:null,byName:null,at:null,reason:null}}; }
  return rooms;
}
function xlsRows(wb,name){ const ws=wb.Sheets[name]; if(!ws)return[]; return XLSX.utils.sheet_to_json(ws,{header:1,defval:""}); }
function parseDate(s){ const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{2})/); if(!m)return null; return new Date(2000+ +m[3], +m[2]-1, +m[1]); }
function enrich(rooms,wb,today){ const ensure=rm=>{ if(!rooms[rm]){ const b=rm[0]; rooms[rm]={room:rm,section:sectionOf(rm),building:b,area:"",deluxeRoom:"678".includes(b),type:"inhouse",pax:{adults:0,children:0},arrival:today,departure:"",arrivalTime:null,category:"",vip:"",company:"",name:"",specialReq:"",resComment:"",chips:[],flags:{},minibarReq:"",roomServiceReq:"",amenity:"",allergyText:"",attentionNote:"",dlxBenefits:false,wheelchair:false,contagious:false,farewell:false,status:{state:"pending",by:null,byName:null,at:null,reason:null}}; } return rooms[rm]; };
  xlsRows(wb,"Arrivals Master").slice(2).forEach(r=>{ if(!r[0]||r[0]==="Name")return; cleanRooms(r[1]).forEach(rm=>{const x=ensure(rm);x.type="arrival";if(!x.name)x.name=String(r[0]).trim();}); });
  const nt={}; xlsRows(wb,"Daily Overview").forEach(r=>{ if(typeof r[0]==="string"&&r[0].indexOf(",")>=0){ let tm=r[3]; let v=null; if(tm instanceof Date) v=String(tm.getHours()).padStart(2,"0")+":"+String(tm.getMinutes()).padStart(2,"0"); else if(typeof tm==="number"){const h=Math.floor(tm*24),m=Math.round((tm*24-h)*60);v=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");} if(v){const sur=r[0].split(/[,\s]+/)[0].toLowerCase();(nt[sur]=nt[sur]||[]).push(v);} } });
  Object.values(rooms).sort((a,b)=>a.room.localeCompare(b.room)).forEach(r=>{ if(r.type==="arrival"&&r.name){const sur=r.name.split(/[,\s]+/)[0].toLowerCase(); if(nt[sur]&&nt[sur].length)r.arrivalTime=nt[sur].shift();} });
  xlsRows(wb,"Mini Bar- Room Service").slice(2).forEach(r=>{ cleanRooms(r[1]).forEach(rm=>{const q=String(r[4]||"").trim();if(q&&q!=="None")ensure(rm).minibarReq=q;}); cleanRooms(r[7]).forEach(rm=>{const q=String(r[10]||"").trim();if(q&&q!=="None")ensure(rm).roomServiceReq=q;}); });
  xlsRows(wb,"Special Offers").slice(2).forEach(r=>{ cleanRooms(r[1]).forEach(rm=>{const it=String(r[4]||"").trim();const loc=String(r[6]||"").toLowerCase();if(it){const x=ensure(rm);x.amenity=it;if(loc.indexOf("room")>=0)x.chips.push({t:"Amenity in room",c:"amenity"});}}); });
  xlsRows(wb,"Allergy Report").slice(2).forEach(r=>{ cleanRooms(r[1]).forEach(rm=>{const a=String(r[5]||"").trim();if(a&&a!=="None")ensure(rm).allergyText=a;}); });
  xlsRows(wb,"DLX Benefits").slice(2).forEach(r=>{ cleanRooms(r[1]).forEach(rm=>ensure(rm).dlxBenefits=true); });
  xlsRows(wb,"ATTENTION GUESTS").forEach(r=>{ if(!r||r.length<5)return; let com=null; for(let i=4;i<6;i++){if(typeof r[i]==="string"&&r[i].toUpperCase().indexOf("ATTENTION")>=0)com=r[i].trim();} cleanRooms(r[1]).forEach(rm=>{const x=ensure(rm);x.flags.ATT=true;if(com)x.attentionNote=com.slice(0,140);}); });
  xlsRows(wb," TOPSPENDERS-CONTAGIOUS-WHEELCH").forEach(r=>{ cleanRooms(r[1]).forEach(rm=>ensure(rm).wheelchair=true); cleanRooms(r[5]).forEach(rm=>ensure(rm).contagious=true); });
  const todayD=parseDate(today);
  const KW=[["sparkl","Sparkling","amenity"],["champagne","Champagne","amenity"],["cava","Cava","amenity"],["honeymoon","Honeymoon","amenity"],["anniversary","Anniversary","amenity"],["cot","Baby cot","baby"],["crib","Baby cot","baby"],["baby","Baby","baby"],["cake","Cake","amenity"],["soya","Soya milk","diet"],["flower","Flowers","amenity"],["wedding","Wedding","amenity"]];
  Object.values(rooms).forEach(r=>{ const blob=[r.minibarReq,r.roomServiceReq,r.amenity,r.specialReq,r.resComment,r.allergyText].join(" ").toLowerCase(); const seen=new Set(r.chips.map(c=>c.t));
    KW.forEach(a=>{ if(blob.indexOf(a[0])>=0&&!seen.has(a[1])){r.chips.push({t:a[1],c:a[2]});seen.add(a[1]);} });
    if(r.flags.ATT&&!seen.has("Attention")){r.chips.push({t:"Attention",c:"attention"});seen.add("Attention");}
    if(r.deluxeRoom&&!seen.has("Deluxe")){r.chips.push({t:"Deluxe",c:"dlx"});seen.add("Deluxe");}
    if(r.wheelchair&&!seen.has("Wheelchair"))r.chips.push({t:"Wheelchair",c:"care"});
    if(r.contagious&&!seen.has("Contagious"))r.chips.push({t:"Contagious",c:"danger"});
    const d=parseDate(r.departure); if(r.deluxeRoom&&d&&todayD){const diff=Math.round((d-todayD)/864e5);if(diff>=0&&diff<=2){r.farewell=true;if(!seen.has("Farewell gift"))r.chips.unshift({t:"Farewell gift",c:"farewell"});}} });
  return rooms;
}
function readFile(input,bin){ return new Promise((res,rej)=>{ const f=input.files[0]; if(!f){res(null);return;} const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; bin?r.readAsArrayBuffer(f):r.readAsText(f); }); }
function detectDateXlsx(wb){ try{ const ws=wb.Sheets["Daily Overview"]; if(!ws)return null; const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}); for(let i=0;i<Math.min(6,rows.length);i++){ const line=(rows[i]||[]).join(" "); const m=line.match(/\/(\d{1,2})\.(\d{1,2})\/?/); if(m){ return ("0"+m[1]).slice(-2)+"/"+("0"+m[2]).slice(-2)+"/"+String(new Date().getFullYear()).slice(2); } } }catch(e){} return null; }
function detectDateGib(text){ const lines=text.split(/\r?\n/).filter(x=>x.length); if(lines.length<2)return null; const ai=lines[0].split("\t").indexOf("ARRIVAL"); if(ai<0)return null; const cnt={}; for(let i=1;i<lines.length;i++){ const v=(lines[i].split("\t")[ai]||"").trim(); if(parseDate(v)) cnt[v]=(cnt[v]||0)+1; } let best=null,bn=0; for(const k in cnt){ if(cnt[k]>bn){bn=cnt[k];best=k;} } return best; }
function dateFromName(nm){ if(!nm)return null; const m=String(nm).match(/(\d{2})[._-](\d{2})(?:[._-](\d{2,4}))?/); if(!m)return null; const yy=m[3]?String(m[3]).slice(-2):String(new Date().getFullYear()).slice(2); return m[1]+"/"+m[2]+"/"+yy; }
async function parseMoves(buf){ if(typeof mammoth==="undefined")return []; const res=await mammoth.convertToHtml({arrayBuffer:buf}); const doc=new DOMParser().parseFromString(res.value,"text/html"); const moves=[]; Array.prototype.forEach.call(doc.querySelectorAll("table"),function(tb){ const rows=Array.prototype.slice.call(tb.querySelectorAll("tr")); if(!rows.length)return; const head=(rows[0].innerText||"").toUpperCase(); if(head.indexOf("OLD ROOM")>=0 && head.indexOf("NEW ROOM")>=0){ rows.slice(1).forEach(function(tr){ const c=Array.prototype.slice.call(tr.querySelectorAll("td,th")).map(function(x){return (x.innerText||"").trim();}); const o=(c[0]||"").match(/[1-8]\d{3}/), n=(c[3]||"").match(/[1-8]\d{3}/); if(o&&n) moves.push({from:o[0],to:n[0],name:c[1]||"",dates:c[2]||"",pax:c[4]||"",comment:c[7]||""}); }); } }); return moves; }
function applyMoves(rooms, moves){ moves.forEach(function(m){ const r=rooms[m.to]; if(r){ r.type="inhouse"; r.moved={from:m.from,name:m.name,comment:m.comment,dates:m.dates}; } }); }
async function doImport(){ const msg=$("#impmsg");
  try{ const gtext=await readFile($("#f_gib"),false); if(!gtext){ msg.textContent=t("impNeed"); return; }
    const xbuf=await readFile($("#f_xls"),true); let wb=null;
    if(xbuf){ if(typeof XLSX==="undefined"){ msg.textContent=t("impXlsxFail"); return; } wb=XLSX.read(new Uint8Array(xbuf),{type:"array",cellDates:true}); }
    const xn=($("#f_xls").files[0]||{}).name, dn=($("#f_doc").files[0]||{}).name;
    const today=(wb&&detectDateXlsx(wb))||dateFromName(xn)||dateFromName(dn)||detectDateGib(gtext)||CFG.date; CFG.date=today;
    let rooms=gibParse(gtext, today);
    if(wb) rooms=enrich(rooms,wb,today);
    const dbuf=await readFile($("#f_doc"),true); let moves=[];
    if(dbuf){ moves=await parseMoves(dbuf); applyMoves(rooms,moves); }
    Object.values(rooms).forEach(r=>{ const old=S.rooms[r.room]; if(old){ if(old.status&&old.status.state!=="pending") r.status=old.status; if(old.farewellStatus&&old.farewellStatus.state!=="pending") r.farewellStatus=old.farewellStatus; } });
    const keepNotes={}; Object.keys(S.notes||{}).forEach(rm=>{ const n=S.notes[rm], nr=rooms[rm]; if(nr && nr.arrival===n.arr) keepNotes[rm]=n; }); S.notes=keepNotes;
    S.rooms=rooms; S.date=today; S.moves=moves; S.moveDate=today; S=normalizeState(S); audit("Import", Object.keys(rooms).length+" rooms"+(moves.length?(" · "+moves.length+" moves"):"")); persist();
    const arr=Object.values(rooms).filter(r=>r.type==="arrival").length;
    msg.innerHTML='<span style="color:var(--green-d)">✓ '+today+' — '+t("impOk1")+' '+Object.keys(rooms).length+' '+t("impOk2")+' ('+arr+' '+t("impOkArr")+(moves.length?(", "+moves.length+" "+t("movesLoaded")):"")+').</span>'; toast("Import OK"); render();
  }catch(e){ msg.textContent=t("impErr")+e.message; }
}
function movesView(){ let h='<button class="back" data-go="'+(me.role==="manager"?"dash":"sections")+'">‹ '+(me.role==="manager"?t("dashboard"):t("sections"))+'</button><h2 class="sec">'+t("roomChanges")+'</h2>';
  const mv=S.moves||[]; if(!mv.length) return h+'<div class="empty">'+t("noMoves")+'</div>';
  h+='<div class="panel">'; mv.forEach(function(m){ h+='<div class="urow"><span class="mono" style="min-width:120px">'+esc(m.from)+' → '+esc(m.to)+'</span><span class="nm">'+esc(firstLast(m.name))+(m.comment?' · '+esc(m.comment):"")+'</span><span class="rl">'+esc(m.dates||"")+'</span></div>'; });
  return h+'</div>';
}
function histDayView(idx){ const x=(S.history||[])[idx]; let h='<button class="back" data-go="archive">‹ '+t("history")+'</button><h2 class="sec">'+t("dayLog")+' — '+(x?esc(x.date):"")+'</h2><div class="panel">';
  const a=(x&&x.audit)||[]; if(!a.length) h+='<div class="muted" style="font-size:13px">'+t("empty")+'</div>';
  a.forEach(function(e){ const tt=new Date(e.at); const ts=String(tt.getHours()).padStart(2,"0")+":"+String(tt.getMinutes()).padStart(2,"0"); h+='<div class="auditrow"><span class="ti">'+ts+'</span><span class="ac">'+esc(e.action)+'</span><span class="muted">'+esc(e.detail)+'</span><span style="flex:1"></span><span class="faint">'+esc(firstLast(e.user))+'</span></div>'; });
  return h+'</div>';
}
function usersView(){ let h='<button class="back" data-go="dash">‹ '+t("dashboard")+'</button><h2 class="sec">'+t("usersTitle")+'</h2><div class="panel" id="ulist">';
  S.users.forEach((u,i)=>{ h+='<div class="urow" data-i="'+i+'">'+
    '<input class="nme" data-f="name" value="'+esc(u.name)+'" placeholder="'+t("uName")+'">'+
    '<input class="nme" data-f="title" value="'+esc(u.title)+'" placeholder="'+t("uTitle")+'" style="flex:1">'+
    '<select data-f="role"><option value="manager"'+(u.role==="manager"?" selected":"")+'>'+t("manager")+'</option><option value="barista"'+(u.role==="barista"?" selected":"")+'>'+t("barista")+'</option></select>'+
    '<input class="pin" data-f="pin" value="'+esc(u.pin)+'" maxlength="6">'+
    '<label class="rl" style="display:flex;align-items:center;gap:4px"><input type="checkbox" data-f="active"'+(u.active!==false?" checked":"")+'> '+t("uActive")+'</label>'+
    '<button class="xbtn" data-rm="'+i+'" title="'+t("removeUser")+'">×</button></div>'; });
  h+='</div><div class="acts"><button class="btn pri" id="saveUsers">'+t("save")+'</button><button class="btn" id="addUser">+ '+t("addUser")+'</button></div><div class="note">'+t("usersNote")+'</div>';
  return h;
}
function auditView(){ let h='<button class="back" data-go="dash">‹ '+t("dashboard")+'</button><h2 class="sec">'+t("auditTitle")+'</h2><div class="panel">';
  if(!S.audit.length) h+='<div class="muted" style="font-size:13px">'+t("empty")+'</div>';
  S.audit.slice(0,120).forEach(a=>{ const tt=new Date(a.at); const ts=String(tt.getHours()).padStart(2,"0")+":"+String(tt.getMinutes()).padStart(2,"0");
    h+='<div class="auditrow"><span class="ti">'+ts+'</span><span class="ac">'+esc(a.action)+'</span><span class="muted">'+esc(a.detail)+'</span><span style="flex:1"></span><span class="faint">'+esc(firstLast(a.user))+'</span></div>'; });
  return h+'</div>';
}
function archiveView(){ const all=Object.values(S.rooms), c=counts(all);
  let h='<button class="back" data-go="dash">‹ '+t("dashboard")+'</button><h2 class="sec">'+t("closeDay")+'</h2>'+
    '<div class="panel"><h3>'+CFG.date+'</h3><div class="muted" style="font-size:13px">'+t("closed")+' '+(c.done+c.dnd)+'/'+c.total+' · '+t("doneN")+' '+c.done+' · DnD '+c.dnd+' · '+t("pendingN")+' '+c.pending+'</div>'+
    '<div class="acts" style="margin-top:12px"><button class="btn pri sm" id="archDl">'+t("dlJson")+'</button><button class="btn sm" id="archStore">'+t("archiveReset")+'</button></div></div>';
  if(S.history&&S.history.length){ h+='<div class="panel"><h3>'+t("history")+'</h3>'; S.history.slice(0,40).forEach((x,i)=>{ h+='<button class="urow" data-hist="'+i+'" style="width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer"><span class="mono">'+esc(x.date)+'</span><span class="nm muted">'+x.done+' done · '+x.dnd+' DnD'+((x.audit&&x.audit.length)?' · '+x.audit.length+' '+t("dayLog").toLowerCase():"")+'</span><span class="rl">›</span></button>'; }); h+='</div>'; }
  return h;
}

/* ---------- bindings ---------- */
function bindMain(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ view={name:b.dataset.go}; render(); });
  document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{ view={name:"rooms",sec:b.dataset.sec,tab:"arr"}; render(); });
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; render(); });
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{ const rm=b.dataset.room, act=b.dataset.act, which=b.dataset.which||"status";
    if(act==="done") setStatus(rm,"done",null,which);
    else if(act==="dnd"){ const why=prompt(t("dndPrompt"),""); setStatus(rm,"dnd",why?why.trim():null,which); }
    else if(act==="reopen") setStatus(rm,"pending",null,which);
    else if(act==="note") setNote(rm); });
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ const el=document.getElementById(b.dataset.copy);
    try{ navigator.clipboard.writeText(el.innerText).then(()=>toast(t("copied")),()=>toast(t("copyManual"))); }catch(e){ toast(t("copyManual")); } });
  const di=$("#doImport"); if(di) di.onclick=doImport;
  const su=$("#saveUsers"); if(su) su.onclick=()=>{ document.querySelectorAll("#ulist .urow").forEach(row=>{ const i=+row.dataset.i; const u=S.users[i]; if(!u)return;
      u.name=row.querySelector('[data-f="name"]').value.trim()||u.name; u.title=row.querySelector('[data-f="title"]').value.trim();
      u.role=row.querySelector('[data-f="role"]').value; u.pin=row.querySelector('[data-f="pin"]').value.trim()||u.pin; u.active=row.querySelector('[data-f="active"]').checked; });
    audit("Users updated",""); fbUpdate({users:S.users,audit:S.audit}); toast(t("saved")); render(); };
  const au=$("#addUser"); if(au) au.onclick=()=>{ S.users.push({id:"u_"+Date.now(),name:"",title:"Barista",role:"barista",pin:"",active:true}); render(); };
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ if(!confirm(t("removeUser")))return; S.users.splice(+b.dataset.rm,1); audit("User removed",""); fbUpdate({users:S.users,audit:S.audit}); render(); });
  document.querySelectorAll("[data-hist]").forEach(b=>b.onclick=()=>{ view={name:"histday",idx:+b.dataset.hist}; render(); });
  const ad=$("#archDl"); if(ad) ad.onclick=()=>{ const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ikos_minibar_"+CFG.date.replace(/\//g,"-")+".json"; a.click(); };
  const as=$("#archStore"); if(as) as.onclick=()=>{ if(!confirm(t("confirmArchive")))return; const c=counts(Object.values(S.rooms)); S.history=S.history||[]; audit("Day closed",CFG.date); S.history.unshift({date:CFG.date,done:c.done,dnd:c.dnd,total:c.total,at:Date.now(),audit:(S.audit||[]).slice(0,1000)});
    Object.values(S.rooms).forEach(r=>{ r.status={state:"pending",by:null,byName:null,at:null,reason:null}; r.farewellStatus={state:"pending"}; }); S.audit=[]; persist(); toast(t("saved")); view={name:"dash"}; render(); };
}
$("#logout").onclick=()=>{ me=null; view={name:"login"}; pinBuf=""; render(); };
$("#lang").onclick=()=>{ setLang(lang==="en"?"el":"en"); };

function loadLib(src){ const s=document.createElement("script"); s.src=src; document.head.appendChild(s); }
function loadXLSX(){ loadLib("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"); loadLib("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"); }
loadLocal(); render(); loadXLSX(); connectFirebase();
setInterval(()=>{ $("#clock").textContent=nowHHMM(); }, 30000);
</script>
