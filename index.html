<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ikos Aria · Mini Bar & Room Service</title>
<style>
:root{
  --ink:#11243A; --navy:#16365C; --teal:#0F7B6C; --teal-d:#0B5C51;
  --bg:#EEF2F7; --surface:#FFFFFF; --line:#DCE3EC; --line-2:#C7D2DF;
  --txt:#1A2B3C; --muted:#62748A; --faint:#90A0B2;
  --blue:#2D6CB5; --blue-bg:#E7F0FB; --blue-d:#0E4078;
  --amber:#B5710E; --amber-bg:#FBEFDC; --amber-d:#7A4B05;
  --green:#0F8A5F; --green-bg:#E2F3EC; --green-d:#0A5C40;
  --red:#C0392B; --red-bg:#FBE9E7; --red-d:#7E251B;
  --purple:#6B4FA3; --purple-bg:#EFEAF8; --purple-d:#46307A;
  --r:10px; --r-lg:14px;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;height:54px}
.brand{font-weight:600;letter-spacing:.2px;font-size:15px;white-space:nowrap}
.brand b{color:#7FE3CF;font-weight:600}
.top .sp{flex:1}
.clock{font-family:var(--mono);font-size:13px;color:#B9C7D6;background:rgba(255,255,255,.08);padding:4px 10px;border-radius:8px}
.who{font-size:13px;color:#D7E0EA;text-align:right;line-height:1.2}
.who b{color:#fff;font-weight:600;display:block}
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--txt);padding:9px 14px;border-radius:var(--r);font-size:14px;font-weight:500;transition:.12s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-d)}
.btn.ghost-l{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;padding:7px 12px}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.block{width:100%;display:block}
.btn[disabled]{opacity:.45;pointer-events:none}

/* login */
.login{min-height:calc(100vh - 54px);display:flex;align-items:center;justify-content:center;padding:24px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 26px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(17,36,58,.07)}
.lcard h1{font-size:19px;margin:6px 0 2px;color:var(--ink)}
.lcard .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.pinrow{font-family:var(--mono);font-size:30px;letter-spacing:10px;height:44px;color:var(--ink);margin:4px 0 14px;min-height:44px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;font-size:22px;border:1px solid var(--line);background:#FAFBFD;border-radius:12px;color:var(--ink);font-family:var(--mono)}
.pad button:active{background:#EEF2F7}
.pad .act{font-size:14px;font-family:var(--sans);color:var(--muted)}
.lerr{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
.hint{margin-top:16px;font-size:12px;color:var(--faint)}

/* generic */
main{padding:16px 0 60px}
.row{display:flex;align-items:center;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
h2.sec{font-size:18px;margin:2px 0 12px;color:var(--ink);font-weight:600}
.back{background:none;border:none;color:var(--teal);font-size:14px;font-weight:500;padding:6px 0;display:inline-flex;align-items:center;gap:6px}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* section grid */
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.seccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 16px 14px;text-align:left;transition:.12s}
.seccard:hover{border-color:var(--line-2);transform:translateY(-1px)}
.seccard .t{font-size:16px;font-weight:600;color:var(--ink)}
.seccard .d{font-size:12px;color:var(--muted);margin:1px 0 12px}
.bar{height:7px;background:#EAEEF4;border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--green)}
.seccard .pct{display:flex;justify-content:space-between;font-size:12px;margin-top:7px}

/* tabs */
.tabs{display:flex;gap:8px;margin:14px 0 14px;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--muted)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .n{font-variant-numeric:tabular-nums;opacity:.8;margin-left:4px}

/* room cards */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px}
.rc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:0 var(--r) var(--r) 0;padding:12px 14px}
.rc.s-done{border-left-color:var(--green);background:#FAFDFB}
.rc.s-dnd{border-left-color:var(--red);background:#FFFBFA}
.rc.arr{border-left-color:var(--blue)}
.rc.arr.s-done{border-left-color:var(--green)} .rc.arr.s-dnd{border-left-color:var(--red)}
.rc .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rno{font-family:var(--mono);font-size:21px;font-weight:600;color:var(--ink);letter-spacing:.5px}
.rno .px{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--faint);margin-left:7px}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-arr{background:var(--blue-bg);color:var(--blue-d)}
.b-inh{background:#EDF1F6;color:var(--muted)}
.b-fw{background:var(--purple-bg);color:var(--purple-d)}
.b-arr.urgent{background:var(--red-bg);color:var(--red-d)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0}
.chip{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;border:1px solid transparent}
.c-diet{background:var(--green-bg);color:var(--green-d)}
.c-allergy{background:var(--red-bg);color:var(--red-d)}
.c-pref{background:#EDF1F6;color:var(--navy)}
.c-amenity{background:#FBE9F0;color:#8A2B55}
.c-baby{background:#FBEFDC;color:var(--amber-d)}
.c-attention{background:var(--amber-bg);color:var(--amber-d)}
.c-dlx{background:#F1ECDA;color:#6E5611}
.c-care{background:var(--blue-bg);color:var(--blue-d)}
.c-danger{background:var(--red);color:#fff}
.c-farewell{background:var(--purple);color:#fff}
.c-other{background:#EDF1F6;color:var(--muted)}
.req{margin:10px 0 0;font-size:13px;display:flex;gap:7px;align-items:flex-start}
.req .k{color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;min-width:64px;padding-top:1px}
.req .v{color:var(--txt)}
.attn{margin-top:9px;font-size:12px;color:var(--amber-d);background:var(--amber-bg);padding:6px 9px;border-radius:8px;line-height:1.35}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .btn{flex:1;text-align:center}
.bd{background:var(--green);border-color:var(--green);color:#fff} .bd:hover{background:var(--green-d)}
.bx{background:var(--surface);border-color:var(--red);color:var(--red)} .bx:hover{background:var(--red-bg)}
.track{margin-top:11px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.track .st{font-weight:600}
.track .st.done{color:var(--green-d)} .track .st.dnd{color:var(--red-d)}
.track .reopen{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:2px}
.empty{text-align:center;color:var(--faint);padding:40px 10px;font-size:14px}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.metric .l{font-size:12px;color:var(--muted)}
.metric .v{font-size:26px;font-weight:600;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
.metric.warn .v{color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.panel h3{font-size:14px;margin:0 0 12px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.srow{display:flex;align-items:center;gap:12px;margin:9px 0}
.srow .lab{width:140px;font-size:13px}
.srow .lab small{color:var(--faint);display:block;font-size:11px}
.srow .bar{flex:1}
.srow .val{width:96px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.note.warn{color:var(--red-d)}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tool{display:flex;align-items:center;gap:10px;text-align:left;padding:14px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:14px;font-weight:500;color:var(--ink)}
.tool:hover{border-color:var(--line-2)}
.tool .ic{width:34px;height:34px;border-radius:9px;background:var(--blue-bg);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tool small{display:block;font-weight:400;color:var(--muted);font-size:12px}

/* email + lists */
.mailcard{margin-bottom:14px}
.maildump{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;background:#F7F9FC;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--txt);max-height:280px;overflow:auto;line-height:1.5}
.recip{font-size:11px;color:var(--faint);margin:8px 0 0;word-break:break-all}
.auditrow{display:flex;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.auditrow .ti{font-family:var(--mono);color:var(--faint);font-size:12px;white-space:nowrap}
.auditrow .ac{font-weight:500}
.urow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.urow .nm{flex:1}.urow .rl{font-size:12px;color:var(--muted)}
.urow input{width:84px;font-family:var(--mono);text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:14px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#EDF1F6;color:var(--navy)}
.tag.mgr{background:var(--blue-bg);color:var(--blue-d)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:.2s}
.toast.on{opacity:1}
.file-in{display:block;margin:8px 0;font-size:13px}
.lt{font-size:12px;color:var(--faint);margin:2px 0 14px}
@media(max-width:560px){.who .rl{display:none}.brand{font-size:14px}.rooms{grid-template-columns:1fr}}
</style>
</head>
<body>

  <div class="brand">Ikos Aria · <b>Mini Bar</b></div>
  <div class="sp"></div>
  <div class="clock mono" id="clock">--:--</div>
  <div class="who" id="who"></div>
  <button class="btn ghost-l sm hide" id="logout">Έξοδος</button>
</div></div>
<div id="root"></div>
<div class="toast" id="toast"></div>

let S = { date:CFG.date, rooms:{}, audit:[], history:[], pins:{} };

function ls(get,val){ try{ if(get) return localStorage.getItem("iar_mb"); localStorage.setItem("iar_mb",val);}catch(e){return null;} }
function seedRooms(){ const o={}; SEED.rooms.forEach(r=>{o[r.room]=r;}); return o; }
function freshState(){ return {date:CFG.date, rooms:seedRooms(), audit:[], history:[], pins:{}}; }

function persist(){
  if(FB){ FB.ref("state").set(S); }
  else { ls(false, JSON.stringify(S)); }
}
function loadLocal(){
  const raw=ls(true);
  if(raw){ try{ S=JSON.parse(raw); if(!S.rooms||Object.keys(S.rooms).length===0) S=freshState(); }catch(e){ S=freshState(); } }
  else S=freshState();
}

/* ---------- firebase (live sync) ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load "+src)); document.head.appendChild(s); }); }
function connectFirebase(){
  if(!CFG.firebase || !CFG.firebase.apiKey){ return; }
  Promise.all([
    loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"),
    loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"),
    loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js")
  ]).then(()=>{
    firebase.initializeApp(CFG.firebase);
    return firebase.auth().signInAnonymously();
  }).then(()=>{
    FB=firebase.database();
    return FB.ref("state").once("value");
  }).then(snap=>{
    const v=snap.val();
    if(v && v.rooms && Object.keys(v.rooms).length){ S=v; } else { FB.ref("state").set(S); }
    FB.ref("state").on("value", s=>{ const nv=s.val(); if(nv){ S=nv; render(); } });
    render(); toast("Live sync \u2713");
  }).catch(e=>{ console.warn("Firebase off:",e); FB=null; toast("\u03a4\u03bf\u03c0\u03b9\u03ba\u03ae \u03bb\u03b5\u03b9\u03c4\u03bf\u03c5\u03c1\u03b3\u03af\u03b1 (offline)"); });
}

function setStatus(rm,state,reason){
  const r=S.rooms[rm]; if(!r)return;

  audit(state==="done"?"Done":state==="dnd"?"DnD":"Reopen", rm+(reason?" · "+reason:""));

}

/* ---- coverage math ---- */
function coverage(list){
  let tot=0, done=0;
  list.forEach(r=>{ const w=effort(r.room); tot+=w; if(r.status.state==="done"||r.status.state==="dnd") done+=w; });
  return tot? Math.round(done/tot*100):0;
}
function counts(list){
  const c={done:0,dnd:0,pending:0,total:list.length};
  list.forEach(r=>{ c[r.status.state]++; });
  return c;
}

      '<span class="badge '+(u?"b-arr urgent":"b-arr")+'">'+(r.arrivalTime||"—")+'</span></div>';

     tool("emails","✉","Email & λίστες","DnD · farewell · concierge")+

  return h;

  h+='<div class="panel"><h3>2 · Hotel Daily Overview (.xlsx)</h3>'+
     '<input type="file" id="f_xls" accept=".xlsx" class="file-in"><div class="muted" style="font-size:13px">Εμπλουτισμός: mini bar requests, allergies, amenities, deluxe, attention.</div></div>';
  h+='<button class="btn pri block" id="doImport">Φόρτωση & ενημέρωση ημέρας</button>';
  h+='<div class="note">Διατηρεί τα ήδη κλεισμένα δωμάτια (status) όπου το room number ταιριάζει. Τα PREFERENCES (7SUG, AGLU κ.λπ.) γίνονται flags αυτόματα.</div>';
  h+='<div id="impmsg" class="lt" style="margin-top:10px"></div>';
  return h;
}
const PREF={"7SUG":["Sugar-free","diet"],"7VEG":["Vegetarian","diet"],"7VGN":["Vegan","diet"],"7DRY":["Dairy-free","diet"],"7PES":["Pescatarian","diet"],"AGLU":["Gluten allergy","allergy"],"ANUT":["Nut allergy","allergy"],"ANUTSTRN":["Nut allergy","allergy"],"ANUTSTRO":["Nut allergy","allergy"],"AEGG":["Egg allergy","allergy"],"AFIS":["Fish allergy","allergy"],"AFISHTRN":["Fish allergy","allergy"],"AMSH":["Shellfish allergy","allergy"],"AKIW":["Kiwi allergy","allergy"],"ALAT":["Latex allergy","allergy"],"AALCOHOL":["No/low alcohol","pref"],"7ALC":["No/low alcohol","pref"],"ACEREALTRN":["Cereal","diet"],"AOTHFB":["F&B note","diet"]};
function cleanRooms(s){ if(s==null)return[]; const out=[]; String(s).split("/").forEach(p=>{ if(p.indexOf("->")>=0)p=p.split("->").pop(); const m=p.match(/([1-8]\d{3})/); if(m)out.push(m[1]); }); return out; }
function gibParse(text){
  const lines=text.split(/\r?\n/).filter(x=>x.length);
  const head=lines[0].split("\t"); const idx={}; head.forEach((h,i)=>idx[h.trim()]=i);
  const get=(c,col)=>{ const i=idx[col]; return i==null?"":(c[i]||"").trim(); };
  const rooms={}; const today=CFG.date;
  for(let li=1; li<lines.length; li++){
    const c=lines[li].split("\t"); const rm=get(c,"ROOM"); if(!/^[1-8]\d{3}$/.test(rm)||rooms[rm])continue;
    const b=rm[0], deluxe="678".includes(b);
    const chips=[],flags={};
    get(c,"PREFERENCES").split(",").forEach(code=>{ code=code.trim(); if(!code||["1","2","3"].includes(code))return; if(PREF[code]){chips.push({t:PREF[code][0],c:PREF[code][1]});flags[code]=true;} else if(code==="ATT"){flags.ATT=true;} else chips.push({t:code,c:"other"}); });
    rooms[rm]={room:rm,section:sectionOf(rm),building:b,area:CFG.sections[sectionOf(rm)].area,deluxeRoom:deluxe,
      type:get(c,"ARRIVAL")===today?"arrival":"inhouse",
      pax:{adults:+get(c,"ADULTS")||0,children:+get(c,"CHILDREN")||0},
      arrival:get(c,"ARRIVAL"),departure:get(c,"DEPARTURE"),arrivalTime:null,
      category:get(c,"ROOM_CATEGORY_LABEL"),vip:get(c,"VIP"),company:get(c,"COMPANY_NAME"),
      name:get(c,"SHARE_NAMES")||get(c,"FULL_NAME"),specialReq:get(c,"SPECIAL_REQUESTS"),resComment:get(c,"RES_COMMENT"),
      chips,flags,minibarReq:"",roomServiceReq:"",amenity:"",allergyText:"",attentionNote:"",dlxBenefits:false,wheelchair:false,contagious:false,farewell:false,
      status:{state:"pending",by:null,byName:null,at:null,reason:null}};
  }
  return rooms;
}
function xlsRows(wb,name){ const ws=wb.Sheets[name]; if(!ws)return[]; return XLSX.utils.sheet_to_json(ws,{header:1,defval:""}); }
function enrich(rooms,wb){
  const ensure=rm=>{ if(!rooms[rm]){ const b=rm[0]; rooms[rm]={room:rm,section:sectionOf(rm),building:b,area:CFG.sections[sectionOf(rm)].area,deluxeRoom:"678".includes(b),type:"inhouse",pax:{adults:0,children:0},arrival:CFG.date,departure:"",arrivalTime:null,category:"",vip:"",company:"",name:"",specialReq:"",resComment:"",chips:[],flags:{},minibarReq:"",roomServiceReq:"",amenity:"",allergyText:"",attentionNote:"",dlxBenefits:false,wheelchair:false,contagious:false,farewell:false,status:{state:"pending",by:null,byName:null,at:null,reason:null}}; } return rooms[rm]; };
  xlsRows(wb,"Arrivals Master").slice(2).forEach(r=>{ if(!r[0]||r[0]==="Name")return; cleanRooms(r[1]).forEach(rm=>{const x=ensure(rm);x.type="arrival";if(!x.name)x.name=String(r[0]).trim();}); });
  // arrival times
  const nt={}; xlsRows(wb,"Daily Overview").forEach(r=>{ if(typeof r[0]==="string"&&r[0].indexOf(",")>=0){ let t=r[3]; let v=null; if(t instanceof Date) v=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0"); else if(typeof t==="number"){const h=Math.floor(t*24),m=Math.round((t*24-h)*60);v=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");} if(v){const sur=r[0].split(/[,\s]+/)[0].toLowerCase();(nt[sur]=nt[sur]||[]).push(v);} } });
  Object.values(rooms).sort((a,b)=>a.room.localeCompare(b.room)).forEach(r=>{ if(r.type==="arrival"&&r.name){const sur=r.name.split(/[,\s]+/)[0].toLowerCase(); if(nt[sur]&&nt[sur].length)r.arrivalTime=nt[sur].shift();} });
  const mb=xlsRows(wb,"Mini Bar- Room Service").slice(2);
  mb.forEach(r=>{ cleanRooms(r[1]).forEach(rm=>{const q=String(r[4]||"").trim();if(q&&q!=="None")ensure(rm).minibarReq=q;}); cleanRooms(r[7]).forEach(rm=>{const q=String(r[10]||"").trim();if(q&&q!=="None")ensure(rm).roomServiceReq=q;}); });
  xlsRows(wb,"Special Offers").slice(2).forEach(r=>{ cleanRooms(r[1]).forEach(rm=>{const it=String(r[4]||"").trim();const loc=String(r[6]||"").toLowerCase();if(it){const x=ensure(rm);x.amenity=it;if(loc.indexOf("room")>=0)x.chips.push({t:"Amenity στο δωμάτιο",c:"amenity"});}}); });
  xlsRows(wb,"Allergy Report").slice(2).forEach(r=>{ cleanRooms(r[1]).forEach(rm=>{const a=String(r[5]||"").trim();if(a&&a!=="None")ensure(rm).allergyText=a;}); });
  xlsRows(wb,"DLX Benefits").slice(2).forEach(r=>{ cleanRooms(r[1]).forEach(rm=>ensure(rm).dlxBenefits=true); });
  xlsRows(wb,"ATTENTION GUESTS").forEach(r=>{ if(!r||r.length<5)return; let com=null; for(let i=4;i<6;i++){if(typeof r[i]==="string"&&r[i].toUpperCase().indexOf("ATTENTION")>=0)com=r[i].trim();} cleanRooms(r[1]).forEach(rm=>{const x=ensure(rm);x.flags.ATT=true;if(com)x.attentionNote=com.slice(0,140);}); });
  const wc=xlsRows(wb," TOPSPENDERS-CONTAGIOUS-WHEELCH");
  wc.forEach(r=>{ cleanRooms(r[1]).forEach(rm=>ensure(rm).wheelchair=true); cleanRooms(r[5]).forEach(rm=>ensure(rm).contagious=true); });
  // derived chips + farewell
  const today=parseDate(CFG.date);
  const KW=[["sparkl","Sparkling","amenity"],["champagne","Champagne","amenity"],["cava","Cava","amenity"],["honeymoon","Honeymoon","amenity"],["anniversary","Anniversary","amenity"],["cot","Baby cot","baby"],["crib","Baby cot","baby"],["baby","Baby","baby"],["cake","Cake","amenity"],["soya","Soya milk","diet"],["flower","Flowers","amenity"],["wedding","Wedding","amenity"]];
  Object.values(rooms).forEach(r=>{
    const blob=[r.minibarReq,r.roomServiceReq,r.amenity,r.specialReq,r.resComment,r.allergyText].join(" ").toLowerCase();
    const seen=new Set(r.chips.map(c=>c.t));
    KW.forEach(([kw,lbl,cat])=>{ if(blob.indexOf(kw)>=0&&!seen.has(lbl)){r.chips.push({t:lbl,c:cat});seen.add(lbl);} });
    if(r.flags.ATT&&!seen.has("Attention")){r.chips.push({t:"Attention",c:"attention"});seen.add("Attention");}
    if(r.deluxeRoom&&!seen.has("Deluxe")){r.chips.push({t:"Deluxe",c:"dlx"});seen.add("Deluxe");}
    if(r.wheelchair&&!seen.has("Wheelchair"))r.chips.push({t:"Wheelchair",c:"care"});
    if(r.contagious&&!seen.has("Contagious"))r.chips.push({t:"Contagious",c:"danger"});
    const d=parseDate(r.departure);
    if(r.deluxeRoom&&d&&today){const diff=Math.round((d-today)/864e5);if(diff>=0&&diff<=2){r.farewell=true;if(!seen.has("Δώρο αναχώρησης"))r.chips.unshift({t:"Δώρο αναχώρησης",c:"farewell"});}}
  });
  return rooms;
}
function parseDate(s){ const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{2})/); if(!m)return null; return new Date(2000+ +m[3], +m[2]-1, +m[1]); }

function readFile(input,bin){ return new Promise((res,rej)=>{ const f=input.files[0]; if(!f){res(null);return;} const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; bin?r.readAsArrayBuffer(f):r.readAsText(f); }); }
async function doImport(){
  const msg=$("#impmsg");
  try{
    const gtext=await readFile($("#f_gib"),false);
    if(!gtext){ msg.textContent="Δώσε τουλάχιστον το gibyroom .txt."; return; }
    let rooms=gibParse(gtext);
    const xbuf=await readFile($("#f_xls"),true);
    if(xbuf){ if(typeof XLSX==="undefined"){ msg.textContent="Η βιβλιοθήκη xlsx δεν φόρτωσε (έλεγξε σύνδεση)."; } else { const wb=XLSX.read(new Uint8Array(xbuf),{type:"array",cellDates:true}); rooms=enrich(rooms,wb); } }
    // keep existing statuses
    Object.values(rooms).forEach(r=>{ const old=S.rooms[r.room]; if(old&&old.status&&old.status.state!=="pending") r.status=old.status; });
    S.rooms=rooms; S.date=CFG.date; audit("Import", Object.keys(rooms).length+" δωμάτια"); persist();
    const arr=Object.values(rooms).filter(r=>r.type==="arrival").length;
    msg.innerHTML='<span style="color:var(--green-d)">✓ Φορτώθηκαν '+Object.keys(rooms).length+' δωμάτια ('+arr+' αφίξεις). Πήγαινε στον πίνακα.</span>';
    toast("Import OK");
  }catch(e){ msg.textContent="Σφάλμα import: "+e.message; }
}

/* ---------- bindings ---------- */
function bindMain(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ const g=b.dataset.go; view={name:g==="sections"?"sections":g}; render(); });
  document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{ view={name:"rooms",sec:b.dataset.sec,tab:"arr"}; render(); });
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; render(); });
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const rm=b.dataset.room, act=b.dataset.act;
    if(act==="done") setStatus(rm,"done");
    else if(act==="dnd"){ const why=prompt("DnD — λόγος (προαιρετικό): π.χ. DnD sign / no refill", ""); setStatus(rm,"dnd",why?why.trim():null); }
    else if(act==="reopen") setStatus(rm,"pending");
  });
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ const el=document.getElementById(b.dataset.copy); navigator.clipboard.writeText(el.innerText).then(()=>toast("Αντιγράφηκε"),()=>toast("Επίλεξε & αντίγραψε χειροκίνητα")); });
  const di=$("#doImport"); if(di) di.onclick=doImport;
  const sp=$("#savePins"); if(sp) sp.onclick=()=>{ document.querySelectorAll("[data-pin]").forEach(i=>{ S.pins[i.dataset.pin]=i.value.trim(); }); audit("PIN update",""); persist(); toast("PIN αποθηκεύτηκαν"); };
  const ad=$("#archDl"); if(ad) ad.onclick=()=>{ const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ikos_minibar_"+CFG.date.replace(/\//g,"-")+".json"; a.click(); };
  const as=$("#archStore"); if(as) as.onclick=()=>{ if(!confirm("Αρχειοθέτηση ημέρας και μηδενισμός όλων των status;"))return; const c=counts(Object.values(S.rooms)); S.history=S.history||[]; S.history.unshift({date:CFG.date,done:c.done,dnd:c.dnd,total:c.total,at:Date.now()}); Object.values(S.rooms).forEach(r=>r.status={state:"pending",by:null,byName:null,at:null,reason:null}); audit("Κλείσιμο ημέρας",CFG.date); persist(); toast("Αρχειοθετήθηκε"); view={name:"dash"}; render(); };
}
$("#logout").onclick=()=>{ me=null; view={name:"login"}; pinBuf=""; render(); };

/* ---------- boot ---------- */
function loadXLSX(){ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; document.head.appendChild(s); }
loadLocal();
render();
loadXLSX();
connectFirebase();
setInterval(()=>{ $("#clock").textContent=nowHHMM(); }, 30000);
</script>
</body>
</html>
